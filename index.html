<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="pragma" content="no-cache"/>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="utf-8"/>

    <title>Retro Bowl</title>

    <style>
        body {
            background: #000;
            color: #cccccc;
            margin: 0;
            padding: 0;
            border: 0;
        }

        canvas {
            image-rendering: optimizeSpeed;
            -webkit-interpolation-mode: nearest-neighbor;
            -ms-touch-action: none;
            margin: 0;
            padding: 0;
            border: 0;
        }

        :-webkit-full-screen #canvas {
            width: 100%;
            height: 100%;
        }

        div.gm4html5_div_class {
            margin: 0;
            padding: 0;
            border: 0;
        }

        :-webkit-full-screen {
            width: 100%;
            height: 100%;
        }
    </style>

    <!--
        RETRO BOWL SAVE BACKUP
        =======================
        The GameMaker game already uses localStorage for its save files.
        This code makes an additional backup so the browser save is
        less likely to disappear.
    -->
    <script>
    (function () {

        const BACKUP_KEY = "__retrobowl_localstorage_backup__";
        const BACKUP_TIME = "__retrobowl_localstorage_backup_time__";

        function backupGame() {
            try {
                const data = {};

                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);

                    if (!key) continue;

                    // Don't backup our own backup.
                    if (key === BACKUP_KEY || key === BACKUP_TIME)
                        continue;

                    data[key] = localStorage.getItem(key);
                }

                localStorage.setItem(
                    BACKUP_KEY,
                    JSON.stringify(data)
                );

                localStorage.setItem(
                    BACKUP_TIME,
                    Date.now().toString()
                );

            } catch (e) {
                console.log("Retro Bowl backup failed:", e);
            }
        }

        function restoreGame() {
            try {
                const backup = localStorage.getItem(BACKUP_KEY);

                if (!backup)
                    return;

                const data = JSON.parse(backup);

                for (const key in data) {

                    if (!Object.prototype.hasOwnProperty.call(data, key))
                        continue;

                    /*
                     * Only restore a key if it isn't already there.
                     *
                     * This prevents an old backup from overwriting
                     * a newer save.
                     */
                    if (localStorage.getItem(key) === null) {
                        localStorage.setItem(key, data[key]);
                    }
                }

            } catch (e) {
                console.log("Retro Bowl restore failed:", e);
            }
        }

        /*
         * Restore missing saves before GameMaker starts.
         */
        restoreGame();

        /*
         * Backup every 5 seconds.
         */
        setInterval(backupGame, 5000);

        /*
         * Backup when the player closes/reloads the page.
         */
        window.addEventListener("beforeunload", backupGame);

        /*
         * These are optional functions you can use from the
         * browser console for testing.
         */
        window.RetroBowlBackup = backupGame;
        window.RetroBowlRestore = restoreGame;

    })();
    </script>
</head>

<body>

    <div class="gm4html5_div_class" id="gm4html5_div_id">

        <img
            src="html5game/splash.png"
            id="GM4HTML5_loadingscreen"
            alt="GameMaker:HTML5 loading screen"
            style="display:none;"
        />

        <canvas id="canvas" width="853" height="480">
            <p>Your browser doesn't support HTML5 canvas.</p>
        </canvas>

    </div>

    <script type="text/javascript" src="html5game/RetroBowl.js"></script>

    <script>
    (function() {

        function fin(ok) {

            window.PokiSDK_OK = ok;

            GameMaker_Init();
        }

        window.addEventListener("load", function() {

            window.PokiSDK_loadState = 0;

            if (window.PokiSDK) {

                PokiSDK.init().then(function() {
                    fin(true);
                }).catch(function() {
                    fin(false);
                });

            } else {

                window.PokiSDK = null;
                fin(false);

            }

        });

    })();
    </script>

</body>
</html>
